    - source: https://simba.sg/data-protection-notice
      http_status: 200
      fetched: '2026-10-22'
      quote: >-
        If you would like to withdraw your consent for our collection, use and/or disclosure of your Personal
        Data, you may make a withdrawal request by writing an email with your full name and SIMBA account
        number(s) to our Data Protection Officer.
    note: >-
      Access requests go to a named Data Protection Officer by email with a 30-day response commitment (a
