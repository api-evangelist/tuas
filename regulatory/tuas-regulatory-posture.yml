      described.
  data_retention:
    url: https://simba.sg/data-protection-notice
    section: Retention of your Personal Data
    evidence:
    - source: https://simba.sg/data-protection-notice
      http_status: 200
      fetched: '2026-10-22'
      quote: >-
        In accordance with PDPA, we will retain your Personal Data for only as long as there is a business or
        legal purpose. Where we continue to have a business/legal purpose in retaining your Personal Data, we
        regret that we may not be able to comply with any request to delete your Personal Data that we have in
        our possession/control.
    note: >-
      Purpose-bound retention with no stated periods, and an explicit limit on deletion requests while a
      business or legal purpose persists.
  data_residency:
