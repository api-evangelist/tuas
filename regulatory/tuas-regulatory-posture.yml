scope_note: >-
  Tuas Limited's own site (tuas.com.au, a JavaScript shell read rendered) publishes only corporate-governance
  documents (board charter, code of conduct, whistleblower, anti-bribery, diversity, market-disclosure and
  securities-trading policies) and no privacy notice, terms or trust page. Its consumer-facing data
  handling is published by its operating subsidiary SIMBA Telecom Pte Ltd, which tuas.com.au links to at
  https://www.simba.sg/. Every signal below therefore comes from SIMBA's Data Protection Notice, written under
  Singapore's PDPA, and describes the subsidiary's posture rather than a Tuas-group document.
  simba.sg/privacy and simba.sg/privacy-policy return 404; the notice lives at /data-protection-notice, as the
  SIMBA terms (https://simba.sg/terms, 200) state.
