name: Tuas

description: Tuas Limited (ASX:TUA) is an Australian-listed holding company incorporated in March 2020 within the TPG Telecom group. After the TPG Telecom and Vodafone Hutchison Australia merger in June 2020, the Singapore mobile business (TPG Telecom Pte Ltd, now Simba Telecom Pte Ltd) was demerged into Tuas, whose site directs Singapore mobile customers to simba.sg and also publishes material on its acquisition of M1. Its own site (tuas.com.au) carries only About and Investor Relations pages; no developer portal, API documentation or public API is published there.

